<title>__TITULO__</title>
<meta name="description" content="__DESCRIPCION__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root {
    --papel: #ffffff;
    --mesa: #e3e6e4;
    --tinta: #1a1d1c;
    --tinta-2: #3c4240;
    --gris: #687170;
    --regla: #d0d6d3;
    --sello: #1f5a45;
    --llave: #93661c;
    --fondo-suave: #f1f4f2;
    --verde-marca: #5ed29c;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  }
  /* Documento impreso: un solo aspecto en ambos temas, a proposito */
  html, body { background: var(--mesa); color: var(--tinta); }
  body {
    margin: 0;
    font-family: var(--sans);
    font-size: 10.5pt;
    line-height: 1.5;
    padding-block: 28px;
    padding-inline: 16px;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; }
  b, strong { font-weight: 600; color: var(--tinta); }
  a { color: var(--sello); }

  .documento { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; justify-items: center; }
  .documento > * { min-width: 0; }
  .hoja {
    width: 210mm; max-width: 100%; min-height: 297mm;
    background: var(--papel);
    padding: 15mm 19mm 13mm;
    box-shadow: 0 1px 3px rgba(26, 29, 28, .10), 0 10px 28px rgba(26, 29, 28, .10);
    display: flex; flex-direction: column; gap: 5mm;
  }
  .hoja > * { flex-shrink: 0; }

  /* ---------- membrete y pie ---------- */
  .membrete {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    padding-bottom: 3mm; border-bottom: 1.5px solid var(--tinta);
  }
  .logo { font-family: var(--sans); font-weight: 700; font-size: 13pt; letter-spacing: .06em; color: var(--tinta); }
  .logo i { font-style: normal; color: var(--verde-marca); }
  .membrete__datos { text-align: right; font-size: 7.8pt; color: var(--gris); line-height: 1.4; }
  .pie {
    margin-top: auto; display: flex; justify-content: space-between; gap: 12px;
    font-size: 7.8pt; color: var(--gris); padding-top: 2.5mm; border-top: 1px solid var(--regla);
  }

  /* ---------- tipografia de seccion ---------- */
  .seccion { display: grid; gap: 3mm; }
  .antetitulo { font-size: 7.8pt; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--llave); }
  .seccion__titulo { font-size: 17pt; line-height: 1.18; }
  .sub { font-size: 11.5pt; font-family: var(--serif); font-weight: 600; }
  .parrafo { color: var(--tinta-2); max-width: 74ch; }
  .nota { font-size: 8.3pt; color: var(--gris); }

  /* ---------- portada ---------- */
  .portada__cuerpo { margin-top: 22mm; display: grid; grid-template-columns: minmax(0, 1fr) 42mm; gap: 8mm; align-items: start; }
  .portada__textos { display: grid; gap: 6mm; }
  .portada__tipo { font-size: 9pt; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--sello); }
  .portada h1 { font-size: 40pt; line-height: 1.04; font-weight: 700; letter-spacing: -.005em; }
  .portada h1 span { display: block; color: var(--tinta-2); font-weight: 400; font-style: italic; font-size: 26pt; margin-top: 3mm; }
  .portada__que { font-family: var(--serif); font-size: 14pt; line-height: 1.35; color: var(--tinta-2); max-width: 34ch; padding-top: 5mm; border-top: 1px solid var(--regla); }

  /* el llavero de habitacion: el objeto que todo recepcionista entrega */
  .llavero { position: relative; margin-top: 6mm; justify-self: end; width: 36mm; }
  .llavero__aro { width: 15mm; height: 15mm; border: 1.6mm solid var(--llave); border-radius: 50%; margin: 0 auto -3mm; position: relative; z-index: 1; }
  .llavero__placa {
    background: var(--sello); color: #fff; border-radius: 18mm 18mm 5mm 5mm;
    padding: 9mm 3mm 7mm; text-align: center; display: grid; gap: 1.5mm;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .llavero__agujero { width: 5mm; height: 5mm; border-radius: 50%; background: var(--papel); margin: -4mm auto 1mm; }
  .llavero__hab { font-family: var(--serif); font-size: 30pt; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .llavero__rot { font-size: 6.8pt; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.82); }
  .llavero__hotel { font-size: 7.5pt; color: rgba(255,255,255,.9); border-top: 1px solid rgba(255,255,255,.3); padding-top: 1.5mm; overflow-wrap: anywhere; line-height: 1.25; }

  .portada__ficha { margin: auto 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1.5px solid var(--tinta); }
  .portada__ficha div { padding: 3.3mm 0; border-bottom: 1px solid var(--regla); display: grid; gap: .8mm; }
  .portada__ficha div:nth-child(odd) { padding-right: 6mm; }
  .portada__ficha dt { font-size: 7.5pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); }
  .portada__ficha dd { margin: 0; font-size: 10pt; line-height: 1.4; }
  .portada__ficha dd small { display: block; color: var(--gris); font-size: 8.8pt; }

  /* ---------- carta ---------- */
  .carta { display: grid; gap: 2.8mm; color: var(--tinta-2); }
  .carta__lugar { text-align: right; }
  .carta__destino { color: var(--tinta); }
  .resumen { border: 1.5px solid var(--tinta); padding: 4.5mm 6mm; display: grid; gap: 3mm; }
  .resumen h2 { font-size: 12.5pt; }
  .resumen dl { display: grid; grid-template-columns: 34mm 1fr; gap: 1.6mm 5mm; margin: 0; }
  .resumen dt { font-size: 9pt; font-weight: 700; color: var(--gris); padding-top: .4mm; }
  .resumen dd { margin: 0; font-size: 9.8pt; color: var(--tinta); }
  .firma-carta { display: grid; gap: .5mm; }
  .firma-carta__linea { width: 58mm; height: 10mm; border-bottom: 1px solid var(--tinta); margin-bottom: 1.5mm; }

  /* ---------- fugas ---------- */
  .fugas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4mm 8mm; }
  .fuga { display: grid; gap: 1.4mm; align-content: start; padding-top: 3mm; border-top: 1.5px solid var(--tinta); }
  .fuga h3 { font-size: 11.5pt; line-height: 1.25; }
  .fuga p { color: var(--tinta-2); font-size: 9.4pt; }
  .fuga__cierre { font-size: 9pt; color: var(--tinta); background: var(--fondo-suave); padding: 2mm 3mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .fuga__cierre b { color: var(--sello); }

  .cuenta { border: 1px dashed var(--gris); padding: 4.5mm 5.5mm; display: grid; gap: 3mm; }
  .cuenta h3 { font-size: 12pt; }
  .cuenta__filas { display: grid; gap: 2.4mm; }
  .cuenta__fila { display: grid; grid-template-columns: 7mm minmax(0, 1fr) 40mm; gap: 3mm; align-items: end; font-size: 10pt; }
  .cuenta__fila span:first-child { font-family: var(--serif); font-weight: 700; color: var(--sello); }
  .blanco { display: block; border-bottom: 1px solid var(--tinta); height: 6mm; }
  .cuenta__ejemplo { font-size: 8.8pt; color: var(--tinta-2); border-top: 1px solid var(--regla); padding-top: 2.5mm; }

  /* ---------- noche ---------- */
  .noche { list-style: none; display: grid; }
  .noche li { display: grid; grid-template-columns: 17mm minmax(0, 1fr); gap: 4mm; padding: 2.4mm 0; border-bottom: 1px solid var(--regla); }
  .noche li:first-child { border-top: 1.5px solid var(--tinta); }
  .hora { font-family: var(--serif); font-weight: 700; font-size: 12pt; color: var(--llave); font-variant-numeric: tabular-nums; line-height: 1.3; }
  .noche h3 { font-size: 10.5pt; font-family: var(--sans); font-weight: 700; }
  .noche p { color: var(--tinta-2); font-size: 9.3pt; }

  .reglas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3mm 8mm; }
  .regla { display: grid; gap: .8mm; }
  .regla h3 { font-size: 10.5pt; }
  .regla p { font-size: 9.2pt; color: var(--tinta-2); }

  /* ---------- prueba ---------- */
  .cifras { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1.5px solid var(--tinta); border-bottom: 1px solid var(--regla); }
  .cifra { padding: 3.5mm 3mm 3.5mm 0; display: grid; gap: .8mm; align-content: start; }
  .cifra + .cifra { padding-left: 3mm; border-left: 1px solid var(--regla); }
  .cifra b { font-family: var(--serif); font-size: 22pt; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cifra span { font-size: 8.4pt; color: var(--tinta-2); line-height: 1.3; }

  .caso { display: grid; grid-template-columns: 38mm minmax(0, 1fr); gap: 6mm; padding: 3.5mm 0; border-bottom: 1px solid var(--regla); }
  .caso__rotulo { display: grid; gap: .8mm; align-content: start; }
  .caso__rotulo b { font-family: var(--serif); font-size: 11.5pt; }
  .caso__rotulo span { font-size: 8.4pt; color: var(--gris); }
  .caso__cuerpo { display: grid; gap: 2mm; color: var(--tinta-2); font-size: 9.5pt; }

  .lista { display: grid; gap: 1.4mm; list-style: none; }
  .lista li { position: relative; padding-left: 4.5mm; color: var(--tinta-2); }
  .lista li::before { content: ""; position: absolute; left: 0; top: .62em; width: 1.6mm; height: 1.6mm; background: var(--sello); }

  .aprendido { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5mm; }
  .aprendido div { display: grid; gap: 1mm; align-content: start; padding-top: 2.5mm; border-top: 1px solid var(--tinta); }
  .aprendido i { font-family: var(--serif); font-size: 9.6pt; color: var(--tinta); }
  .aprendido p { font-size: 8.9pt; color: var(--tinta-2); }

  .autor { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6mm; align-items: end; border: 1.5px solid var(--tinta); padding: 4.5mm 6mm; }
  .autor h3 { font-size: 12.5pt; }
  .autor p { color: var(--tinta-2); font-size: 9.5pt; margin-top: 1.5mm; }
  .autor__datos { font-size: 9pt; color: var(--tinta-2); text-align: right; line-height: 1.55; }

  /* ---------- planes ---------- */
  .tabla-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 9.3pt; font-variant-numeric: tabular-nums; }
  th, td { padding: 1.8mm 2.4mm; text-align: left; vertical-align: top; border-bottom: 1px solid var(--regla); }
  thead th { font-size: 7.6pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); border-bottom: 1.5px solid var(--tinta); vertical-align: bottom; }
  .planes th, .planes td { padding: 1.15mm 2.4mm; }
  .planes th[scope="row"] { font-weight: 400; color: var(--tinta-2); width: 46%; }
  .planes td { text-align: center; width: 18%; }
  .planes thead th { text-align: center; }
  .planes thead th:first-child { text-align: left; }
  .planes .nombre-plan { display: block; font-family: var(--serif); font-size: 12pt; letter-spacing: 0; text-transform: none; color: var(--tinta); }
  .planes .precio { font-family: var(--serif); font-size: 15pt; font-weight: 700; color: var(--tinta); line-height: 1.1; }
  .planes .mes { font-size: 8.6pt; color: var(--gris); }
  .rec { background: var(--fondo-suave); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .marca-rec { display: inline-block; margin-bottom: 1mm; font-size: 6.8pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #fff; background: var(--sello); padding: .6mm 1.8mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .si::before { content: "●"; color: var(--tinta); font-size: 8pt; }
  .rec .si::before { color: var(--sello); }
  .no { color: var(--regla); }
  .planes tr.grupo td { font-size: 7.6pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--sello); padding-top: 2mm; border-bottom: 1px solid var(--tinta); text-align: left; background: none; }

  .dos-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4mm 9mm; }
  .col { display: grid; gap: 2mm; align-content: start; }
  .destacado { border-left: 1.2mm solid var(--llave); padding: 2.5mm 0 2.5mm 4mm; display: grid; gap: 1mm; }
  .destacado b { font-family: var(--serif); font-size: 11pt; }
  .destacado p { font-size: 9.3pt; color: var(--tinta-2); }

  .comparar td:first-child, .comparar th:first-child { width: 50%; }
  .comparar td { color: var(--tinta-2); font-size: 9pt; }

  .preguntas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3.2mm 8mm; }
  .pregunta { display: grid; gap: .8mm; align-content: start; }
  .pregunta h3 { font-size: 10.3pt; }
  .pregunta p { color: var(--tinta-2); font-size: 9.2pt; }

  .pasos { list-style: none; counter-reset: paso; display: grid; }
  .pasos li { counter-increment: paso; display: grid; grid-template-columns: 8mm 1fr; gap: 2mm; padding: 2.4mm 0; border-bottom: 1px solid var(--regla); color: var(--tinta-2); }
  .pasos li:first-child { border-top: 1.5px solid var(--tinta); }
  .pasos li::before { content: counter(paso) "."; font-family: var(--serif); font-weight: 700; font-size: 11.5pt; color: var(--sello); line-height: 1.25; }

  .contacto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1.5px solid var(--tinta); border-bottom: 1px solid var(--regla); }
  .contacto div { padding: 3.5mm 3mm 3.5mm 0; display: grid; gap: .8mm; }
  .contacto div + div { padding-left: 3mm; border-left: 1px solid var(--regla); }
  .contacto dt { font-size: 7.5pt; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); }
  .contacto dd { margin: 0; font-family: var(--serif); font-size: 12pt; font-weight: 600; overflow-wrap: anywhere; }
  .contacto a { color: var(--tinta); text-decoration: none; }

  .eleccion { display: flex; flex-wrap: wrap; gap: 2.5mm 7mm; align-items: center; font-size: 9.8pt; }
  .caja { display: inline-block; width: 3.6mm; height: 3.6mm; border: 1.2px solid var(--tinta); vertical-align: -.6mm; margin-right: 2mm; }
  .firmas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12mm; }
  .firma { display: grid; gap: .5mm; font-size: 9pt; color: var(--tinta-2); }
  .firma__linea { height: 14mm; border-bottom: 1px solid var(--tinta); margin-bottom: 1.5mm; }

  /* ---------- barra de descarga (solo pantalla) ---------- */
  .barra {
    position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 5;
    width: 210mm; max-width: 100%;
    display: flex; justify-content: space-between; align-items: center; gap: 12px 20px;
    background: var(--tinta); color: #fff; border-radius: 10px; padding: 12px 12px 12px 20px;
    box-shadow: 0 8px 22px rgba(26, 29, 28, .25);
  }
  .barra__info { display: grid; gap: 2px; min-width: 0; flex: 1 1 auto; }
  .barra__info .logo { color: #fff; font-size: 13px; }
  .barra__info span { font-size: 12.5px; color: rgba(255,255,255,.7); }
  .barra__accion { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
  .boton {
    font: 600 15px/1 var(--sans); background: #fff; color: var(--tinta); border: 0; border-radius: 7px;
    padding: 12px 18px; cursor: pointer; display: inline-flex; gap: 10px; align-items: center; white-space: nowrap;
  }
  .boton:hover { background: #e6ece9; }
  .boton:focus-visible { outline: 3px solid var(--verde-marca); outline-offset: 2px; }
  .boton:disabled { opacity: .7; cursor: progress; }
  .boton svg { width: 18px; height: 18px; }
  .aviso { font-size: 12.5px; color: rgba(255,255,255,.85); }
  .aviso:empty { display: none; }

  @media screen and (max-width: 820px) {
    body { font-size: 15px; }
    .hoja { min-height: 0; padding: 26px 20px 28px; gap: 20px; }
    .portada__cuerpo { margin-top: 20px; grid-template-columns: 1fr; }
    .llavero { justify-self: start; }
    .portada h1 { font-size: 44px; }
    .portada h1 span { font-size: 28px; }
    .portada__que { font-size: 19px; }
    .portada__ficha { margin-top: 28px; }
    .portada__ficha, .dos-col, .firmas, .fugas, .reglas, .preguntas, .aprendido, .contacto, .autor { grid-template-columns: 1fr; }
    .portada__ficha div:nth-child(odd) { padding-right: 0; }
    .contacto div + div { padding-left: 0; border-left: 0; }
    .autor__datos { text-align: left; }
    .cifras { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cifra + .cifra { padding-left: 0; border-left: 0; }
    .caso { grid-template-columns: 1fr; gap: 8px; }
    .cuenta__fila { grid-template-columns: 24px minmax(0, 1fr); }
    .cuenta__fila .blanco { grid-column: 2; }
    .resumen { padding: 16px; }
    .resumen dl { grid-template-columns: 1fr; gap: 2px; }
    .resumen dd { margin-bottom: 10px; }
    .membrete { flex-wrap: wrap; }
    .membrete__datos { text-align: left; }
    table { font-size: 13px; }
    .fuga p, .noche p, .regla p, .pregunta p, .nota, .caso__cuerpo, .aprendido p { font-size: 14px; }
    .barra { top: calc(8px + env(safe-area-inset-top, 0px)); padding: 12px; flex-wrap: wrap; }
    .barra__info { flex-basis: 100%; }
    .barra__accion, .boton { width: 100%; justify-content: center; }
  }

  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: var(--papel); }
    body { padding: 0; }
    .documento { display: block; }
    .hoja { width: 210mm; height: 296.5mm; min-height: 0; box-shadow: none; overflow: hidden; break-after: page; }
    .hoja:last-child { break-after: auto; }
    .barra { display: none; }
    .tabla-wrap { overflow: visible; }
  }
</style>
